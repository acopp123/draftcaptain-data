name: Update injuries
on:
  schedule:
    - cron: '*/15 * * * *' # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch: {} # run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: injuries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/injuries.mjs
      - run: node scripts/trending.mjs
      - run: node scripts/projections.mjs # Sleeper, kept for comparison
      - run: node scripts/projections-model.mjs # our nflverse model -> projections.json
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "injury-bot"
            git config user.email "injury-bot@users.noreply.github.com"
            git add -A
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
